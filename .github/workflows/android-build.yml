name: Android Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scrapers/**'
      - 'backend/**'
      - 'ios/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'scrapers/**'
      - 'backend/**'
      - 'ios/**'
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Download offline map bundle
        env:
          MAP_BUNDLE_URL: ${{ secrets.MAP_BUNDLE_URL }}
        run: |
          mkdir -p backend/data
          curl -fsSL "$MAP_BUNDLE_URL" -o backend/data/map-bundle.zip
          unzip -q backend/data/map-bundle.zip -d backend/data/map-bundle
          # Keep in sync with `requiredMapFiles` in android/app/build.gradle.kts.
          for f in style-light.json style-dark.json bulgaria.mbtiles; do
            if [ ! -f "backend/data/map-bundle/$f" ]; then
              echo "::error::map-bundle.zip is missing $f. Regenerate with 'bash backend/scripts/build-map-bundle.sh' and re-upload to \$MAP_BUNDLE_URL."
              exit 1
            fi
          done

      - name: Run core tests
        working-directory: android
        run: ./gradlew :core:test

      - name: Build Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Run lint
        working-directory: android
        run: ./gradlew lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
