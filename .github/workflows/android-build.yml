name: Android Build

# Self-hosted only. Runs on the M4 Mac mini (label `srednabg`). Triggered on push
# to main ONLY: pushes to main are maintainer-only, so the public repo's fork PRs
# never execute code on the self-hosted box. See .github/SELF_HOSTED_RUNNER.md.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scrapers/**'
      - 'backend/**'
      - 'ios/**'
      - 'web/**'
      - 'qa/**'
      - '**.md'

concurrency:
  group: android-build
  # Superseded pushes to main are cancelled — only the newest commit needs a build.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS, srednabg]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Wire Android SDK into env
        run: bash .github/scripts/setup-env.sh android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Download offline map bundle
        env:
          MAP_BUNDLE_URL: ${{ secrets.MAP_BUNDLE_URL }}
        run: bash .github/scripts/download-map-bundle.sh

      # `assembleDebug` builds both flavors in one invocation, each embedding the
      # ~52 MB map bundle into a ~116 MB APK, on a 16 GB mini. A memory-pressure
      # failure surfaces as an opaque AGP worker failure with no cause, so record
      # what the machine looked like going in. (Disk is not a factor — the mini
      # runs ~100 GB of 1 TB — but the line is cheap and keeps the snapshot
      # honest if that ever changes.)
      - name: Runner memory + disk snapshot
        run: |
          vm_stat | head -5
          df -h /

      - name: Run core tests
        working-directory: android
        run: ./gradlew :core:test --stacktrace

      - name: Run app unit tests (both flavors)
        working-directory: android
        run: ./gradlew :app:testAospDebugUnitTest :app:testGmsDebugUnitTest --stacktrace

      # --stacktrace is mandatory here: AGP runs packaging in a Gradle worker, and
      # without it a worker failure prints only "A failure occurred while executing
      # PackageAndroidArtifact$IncrementalSplitterRunnable" with the real cause
      # (OOM, IOException, …) swallowed — undiagnosable after the fact.
      - name: Build Android app (both flavors)
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run lint
        working-directory: android
        run: ./gradlew lint --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          # Flavored: aosp/debug + gms/debug.
          path: android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
