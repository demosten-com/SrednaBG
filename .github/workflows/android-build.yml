name: Android Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scrapers/**'
      - 'backend/**'
      - 'ios/**'
      - 'web/**'
      - 'qa/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'scrapers/**'
      - 'backend/**'
      - 'ios/**'
      - 'web/**'
      - 'qa/**'
      - '**.md'

concurrency:
  group: android-build-${{ github.ref }}
  # Superseded PR runs are cancelled; push-to-main runs always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Download offline map bundle
        env:
          MAP_BUNDLE_URL: ${{ secrets.MAP_BUNDLE_URL }}
        run: |
          mkdir -p backend/data
          # Default: the rolling map-bundle-latest release asset (uploaded by
          # web/fdroid/scripts/publish-map-bundle.sh); the secret is an
          # optional override.
          URL="${MAP_BUNDLE_URL:-https://github.com/${GITHUB_REPOSITORY}/releases/download/map-bundle-latest/map-bundle.zip}"
          curl -fsSL "$URL" -o backend/data/map-bundle.zip
          unzip -q backend/data/map-bundle.zip -d backend/data/map-bundle
          # Keep in sync with `requiredMapFiles` in android/app/build.gradle.kts.
          for f in style-light.json style-dark.json bulgaria.mbtiles; do
            if [ ! -f "backend/data/map-bundle/$f" ]; then
              echo "::error::map-bundle.zip is missing $f. Regenerate + republish with 'bash web/fdroid/scripts/publish-map-bundle.sh'."
              exit 1
            fi
          done

      - name: Run core tests
        working-directory: android
        run: ./gradlew :core:test

      - name: Run app unit tests (both flavors)
        working-directory: android
        run: ./gradlew :app:testAospDebugUnitTest :app:testGmsDebugUnitTest

      - name: Build Android app (both flavors)
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Run lint
        working-directory: android
        run: ./gradlew lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          # Flavored: aosp/debug + gms/debug.
          path: android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14
