name: QA

# Self-hosted only. Drives the qa/ harness against a real Pixel_8a emulator
# (Android) and a booted iOS Simulator on the M4 Mac mini (label `srednabg`).
#
# Triggers are maintainer-controlled (push to main / schedule / manual) — the
# public repo's fork PRs never reach the self-hosted box. The harness does NOT
# build or install, so each job assembles + installs the app first.
#
# IMPORTANT: the iOS Simulator needs an active GUI login session (Metal). The
# runner must run as a LaunchAgent in the logged-in desktop session, not a
# headless LaunchDaemon. See .github/SELF_HOSTED_RUNNER.md.
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'qa/**'
  schedule:
    # The nightly starts at 01:00 Europe/Sofia — but not because of this line.
    # GitHub fires cron best-effort and UTC-only: the old '0 1 * * *' arrived
    # 1–6 h late every night (median 05:46 UTC in 2026-09) and could never
    # follow Sofia across DST. So the cron only has to arrive *early* — 19:07
    # UTC is 22:07 EEST / 21:07 EET, three to four hours of slack — and the
    # `wait-for-1am` job below holds the run until the wall clock says 01:00.
    # Minute 7, not 0: the top of the hour is GitHub's documented peak.
    - cron: '7 19 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'QA suite to run'
        type: choice
        default: nightly
        options: [smoke, representative, scenarios, sync, ui, full-zones, nightly]
      platforms:
        description: 'Which platforms (nightly path only)'
        type: choice
        default: both
        options: [both, android, ios]

permissions:
  contents: read

jobs:
  # ── Fast per-push signal: Android smoke only (~5 min). ────────────────────
  smoke:
    if: github.event_name == 'push'
    runs-on: [self-hosted, macOS, srednabg]
    concurrency:
      group: qa
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6

      - name: Download offline map bundle
        env:
          MAP_BUNDLE_URL: ${{ secrets.MAP_BUNDLE_URL }}
        run: bash .github/scripts/download-map-bundle.sh

      - name: Provision Python venv
        run: bash scripts/setup-python.sh

      - name: Wire Android SDK into env
        run: bash .github/scripts/setup-env.sh android

      - name: Boot emulator
        run: bash .github/scripts/boot-emulator.sh

      - name: Build + install gms debug APK
        run: bash .github/scripts/android-build-install.sh

      - name: Run smoke suite (Android, gms)
        run: |
          python3 qa/srednabg_qa.py --suite smoke --flavor gms \
            --reports-dir qa/reports/android

      - name: Shut down emulator
        if: always()
        run: adb emu kill || true

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-smoke-reports
          path: qa/reports/**
          retention-days: 14

  # ── Hold a scheduled run until 01:00 Europe/Sofia. ─────────────────────────
  # On a GitHub-hosted runner on purpose: the waiting must not occupy the Mac
  # mini (a push in the evening would queue its smoke run behind a sleeping
  # job), and the mini itself can't do the triggering — it deliberately holds
  # no GitHub credential, so a local launchd + `gh workflow run` is out.
  # Skipped for workflow_dispatch: a manual run starts immediately.
  wait-for-1am:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 350   # under the 6 h hosted-job limit; the wait is ≤ ~4 h
    steps:
      - name: Sleep until 01:00 Europe/Sofia
        env:
          TZ: Europe/Sofia   # the tz database handles EEST/EET — no month maths
        run: |
          now=$(date +%s)
          hour=$(date +%-H)
          if [ "$hour" -ge 12 ]; then
            target=$(date -d 'tomorrow 01:00' +%s)   # the normal case: evening
          elif [ "$hour" -lt 1 ]; then
            target=$(date -d 'today 01:00' +%s)      # arrived just after midnight
          else
            target=$now                              # GitHub delivered it late: go now
          fi
          echo "Now $(date '+%F %T %Z'); starting the nightly at $(date -d "@$target" '+%F %T %Z')."
          sleep $(( target - now ))

  # ── Long nightly run: Android + iOS in PARALLEL within this one job. ───────
  # One runner executes one job at a time, so a matrix would serialise — we run
  # the two platforms as concurrent background processes instead. Wall-clock ≈
  # the slower platform (~2 h) rather than the ~4 h serial sum.
  nightly:
    needs: wait-for-1am
    # `!cancelled()` so the job still runs when `wait-for-1am` was skipped
    # (workflow_dispatch) — a skipped `needs` otherwise skips its dependents.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.wait-for-1am.result != 'failure' }}
    runs-on: [self-hosted, macOS, srednabg]
    concurrency:
      group: qa
      cancel-in-progress: false
    env:
      SUITE: ${{ github.event.inputs.suite || 'nightly' }}
      PLATFORMS: ${{ github.event.inputs.platforms || 'both' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6

      - name: Download offline map bundle
        env:
          MAP_BUNDLE_URL: ${{ secrets.MAP_BUNDLE_URL }}
        run: bash .github/scripts/download-map-bundle.sh

      - name: Provision Python venv
        run: bash scripts/setup-python.sh

      - name: Wire Android SDK + Xcode into env
        run: bash .github/scripts/setup-env.sh android xcode

      # ── Android prep (boot first, then install onto it) ──
      - name: Boot emulator
        if: env.PLATFORMS != 'ios'
        run: bash .github/scripts/boot-emulator.sh

      - name: Build + install gms debug APK
        id: android-build
        if: env.PLATFORMS != 'ios'
        run: bash .github/scripts/android-build-install.sh

      # ── iOS prep (script builds, boots a Simulator, then installs) ──
      - name: Build + install iOS Debug app
        id: ios-build
        if: env.PLATFORMS != 'android'
        run: bash .github/scripts/ios-build-install.sh

      - name: Fixed Android core regressions
        if: env.PLATFORMS != 'ios'
        working-directory: android
        run: ./gradlew :core:test --rerun-tasks

      - name: Fixed iOS core regressions
        if: ${{ !cancelled() && env.PLATFORMS != 'android' }}
        working-directory: ios
        run: swift test --filter SrednaBGCoreTests

      - name: Capture shared live zone catalog
        id: live-catalog
        if: ${{ !cancelled() }}
        run: python3 -m qa.zone_source --download qa/reports/zones-live.json

      # ── Run both platforms concurrently ──
      - name: Run nightly suites in parallel
        if: ${{ !cancelled() && steps.live-catalog.outcome == 'success' && (env.PLATFORMS == 'ios' || steps.android-build.outcome == 'success') && (env.PLATFORMS == 'android' || steps.ios-build.outcome == 'success') }}
        run: |
          set -u
          A=""; I=""; ra=0; ri=0
          if [ "$PLATFORMS" != "ios" ]; then
            python3 qa/srednabg_qa.py --platform android --suite "$SUITE" --flavor gms --zones live \
              --zones-snapshot qa/reports/zones-live.json \
              --reports-dir qa/reports/android > qa-android.log 2>&1 & A=$!
            echo "Android QA started (pid $A)"
          fi
          if [ "$PLATFORMS" != "android" ]; then
            python3 qa/srednabg_qa.py --platform ios --suite "$SUITE" --zones live \
              --zones-snapshot qa/reports/zones-live.json \
              --reports-dir qa/reports/ios > qa-ios.log 2>&1 & I=$!
            echo "iOS QA started (pid $I)"
          fi
          # `|| ra=$?` keeps a failing wait from tripping the shell's -e mode,
          # which would kill the step here — before the exit-code echoes, the
          # log tails below, and the wait for the other platform.
          [ -n "$A" ] && { wait "$A" || ra=$?; echo "Android QA exit=$ra"; }
          [ -n "$I" ] && { wait "$I" || ri=$?; echo "iOS QA exit=$ri"; }
          echo "===== Android log (tail) ====="; tail -n 60 qa-android.log 2>/dev/null || true
          echo "===== iOS log (tail) ====="; tail -n 60 qa-ios.log 2>/dev/null || true
          # Fail the job if either platform that ran failed.
          [ "$ra" -eq 0 ] && [ "$ri" -eq 0 ]

      - name: Tear down devices
        if: always()
        run: |
          adb emu kill || true
          xcrun simctl shutdown all || true

      - name: Publish QA coverage summary
        if: always()
        run: |
          for report in qa/reports/android/*/summary.md qa/reports/ios/*/summary.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload QA reports + logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-nightly-reports
          path: |
            qa/reports/**
            qa-android.log
            qa-ios.log
            android/core/build/test-results/test/**
          retention-days: 14

      # Failure-only: a green night is silent. Same bot + chat as the scraper
      # cron, fed from repository secrets (the cron's copy lives on the web
      # host). `failure()` covers every earlier step, so a build or boot that
      # dies before the suites run is reported too. Last, so the run link in
      # the message already has the report artifact behind it.
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/notify-qa-failure.py
