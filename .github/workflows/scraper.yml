name: Zone Data Scraper

on:
  pull_request:
    paths:
      - 'scrapers/**'
      - '.github/workflows/scraper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd scrapers
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          cd scrapers
          python -m ruff check .

      - name: Run scraper pipeline
        # Non-blocking: a flaky upstream must not fail PRs that don't touch scraper
        # logic. pytest (fixtures) is the real gate; the committed zones.json is a
        # manually-refreshed snapshot, so the live scrape is only a smoke signal.
        continue-on-error: true
        run: |
          cd scrapers
          python -m src.output --verbose

      - name: Run tests
        run: |
          cd scrapers
          python -m pytest
