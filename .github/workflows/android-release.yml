name: Android Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Parse version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VN="${TAG#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$VN"
          VC=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"

      - name: Download offline map bundle
        env:
          MAP_BUNDLE_URL_OVERRIDE: ${{ secrets.MAP_BUNDLE_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p backend/data
          CHECKSUMS=web/fdroid/map-bundle-checksums.txt

          if [ -n "$MAP_BUNDLE_URL_OVERRIDE" ]; then
            URL="$MAP_BUNDLE_URL_OVERRIDE"
            EXPECTED_SHA=""
            echo "::notice::Using MAP_BUNDLE_URL override (no checksum check)"
          else
            # The rolling map-bundle-latest release keeps only the mutable
            # latest bundle (uploaded by web/fdroid/scripts/publish-map-bundle.sh);
            # this workflow snapshots it into an immutable per-tag release
            # asset further down.
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/map-bundle-latest/map-bundle.zip"
            EXPECTED_SHA="$(awk '$0 !~ /^#/ && $2 == "map-bundle.zip" {print $1; exit}' "$CHECKSUMS" || true)"
            if [ -z "$EXPECTED_SHA" ]; then
              echo "::error::No SHA-256 for map-bundle.zip in $CHECKSUMS. Update it to the current map bundle's digest."
              exit 1
            fi
          fi

          echo "Downloading $URL"
          curl -fsSL "$URL" -o backend/data/map-bundle.zip

          if [ -n "$EXPECTED_SHA" ]; then
            echo "$EXPECTED_SHA  backend/data/map-bundle.zip" | sha256sum -c -
          fi

          unzip -q backend/data/map-bundle.zip -d backend/data/map-bundle
          # Keep in sync with `requiredMapFiles` in android/app/build.gradle.kts.
          for f in style-light.json style-dark.json bulgaria.mbtiles; do
            if [ ! -f "backend/data/map-bundle/$f" ]; then
              echo "::error::map-bundle.zip is missing $f. Regenerate + republish with 'bash web/fdroid/scripts/publish-map-bundle.sh'."
              exit 1
            fi
          done

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore/srednabg-release.jks"

      - name: Assemble signed release APK
        working-directory: android
        env:
          SREDNABG_RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/srednabg-release.jks
          SREDNABG_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SREDNABG_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SREDNABG_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # GitHub Releases ship the aosp flavor (LocationManager, no Google
          # Play Services) — works on every phone incl. de-Googled, and matches
          # what F-Droid builds. The gms flavor goes to the Play Store only.
          ./gradlew :app:assembleAospRelease --stacktrace \
            -PSREDNABG_RELEASE_STORE_FILE="$SREDNABG_RELEASE_STORE_FILE" \
            -PSREDNABG_RELEASE_STORE_PASSWORD="$SREDNABG_RELEASE_STORE_PASSWORD" \
            -PSREDNABG_RELEASE_KEY_ALIAS="$SREDNABG_RELEASE_KEY_ALIAS" \
            -PSREDNABG_RELEASE_KEY_PASSWORD="$SREDNABG_RELEASE_KEY_PASSWORD" \
            -PSREDNABG_VERSION_NAME=${{ steps.ver.outputs.name }} \
            -PSREDNABG_VERSION_CODE=${{ steps.ver.outputs.code }}

      - name: Rename APK + generate checksum
        id: artifact
        run: |
          SRC=android/app/build/outputs/apk/aosp/release/app-aosp-release.apk
          OUT=srednabg-${{ steps.ver.outputs.name }}.apk
          mv "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Snapshot map bundle for the release
        id: bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Freeze the (mutable) latest bundle into an immutable, versioned
          # release asset. This is the durable build input F-Droid's prebuild
          # fetches — as long-lived as the source itself.
          OUT="map-bundle-${TAG}.zip"
          cp backend/data/map-bundle.zip "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore/srednabg-release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES=(
            "${{ steps.artifact.outputs.apk }}"
            "${{ steps.artifact.outputs.apk }}.sha256"
            "${{ steps.bundle.outputs.zip }}"
            "${{ steps.bundle.outputs.zip }}.sha256"
          )
          # Idempotent: re-running on a moved tag updates assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "SrednaBG ${{ steps.ver.outputs.name }}" \
              --generate-notes \
              "${FILES[@]}"
          fi
