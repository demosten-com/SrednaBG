# SrednaBG Backend - Mac Mini M4
#
# Services:
#   tileserver - MapTiler's tileserver-gl serving Bulgaria OpenMapTiles
#   nginx      - Reverse proxy for tiles + zones API + version endpoint

services:
  tileserver:
    image: maptiler/tileserver-gl:latest
    ports:
      - "8070:8080"
    volumes:
      - ./tiles:/data
    command: --verbose
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/usr/share/nginx/data:ro
    depends_on:
      - tileserver
    restart: unless-stopped
