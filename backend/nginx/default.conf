# Rate limiting: 100 requests/minute per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=tiles:10m rate=200r/m;

server {
    listen 80;
    server_name localhost;

    # Gzip compression for JSON and protobuf
    gzip on;
    gzip_types application/json application/x-protobuf application/octet-stream;
    gzip_min_length 256;

    # CORS headers (for development; restrict in production)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Handle preflight requests
    location @cors_preflight {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Content-Length 0;
        return 204;
    }

    # Tile server proxy
    location /tiles/ {
        limit_req zone=tiles burst=50 nodelay;

        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache tile responses in the browser for 1 day
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Zone data API
    location = /api/zones {
        limit_req zone=api burst=10 nodelay;

        alias /usr/share/nginx/data/zones.json;
        default_type application/json;
        charset utf-8;

        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Map bundle (style.json + sprites + glyphs + bulgaria.mbtiles) zipped for
    # one-shot download by the Android MapSyncWorker. Regenerate via
    # backend/scripts/build-map-bundle.sh.
    location = /api/map/bundle.zip {
        limit_req zone=tiles burst=5 nodelay;

        alias /usr/share/nginx/data/map-bundle.zip;
        default_type application/zip;

        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Version endpoint
    location = /api/version {
        limit_req zone=api burst=10 nodelay;

        alias /usr/share/nginx/data/version.json;
        default_type application/json;
        charset utf-8;

        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Health check
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        default_type application/json;
    }
}
