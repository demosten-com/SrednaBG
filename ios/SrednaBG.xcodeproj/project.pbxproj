			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\n\nSRC=\"${SRCROOT}/../backend/data/zones.json\"\nDEST=\"${SRCROOT}/SrednaBG/App/Resources/bundled-zones.json\"\n\nif [ ! -f \"$SRC\" ]; then\n    echo \"error: bundled zones JSON not found at $SRC\" 1>&2\n    echo \"error: regenerate it with \\`bash scrapers/scripts/refresh-zones.sh\\`\" 1>&2\n    exit 1\nfi\n\nmkdir -p \"$(dirname \"$DEST\")\"\ncp \"$SRC\" \"$DEST\"\n\n# Warn (never fail) when the bundled zone data is stale. The top-level `version`\n# field is the scrape timestamp (ISO-8601 UTC); zone data older than\n# MAX_AGE_DAYS days may ship outdated camera zones / speed limits. Mirrors the\n# Android `checkZoneDataFreshness` Gradle task.\nMAX_AGE_DAYS=10\nVERSION=$(sed -n 's/.*\"version\"[[:space:]]*:[[:space:]]*\"\\([^\"]*\\)\".*/\\1/p' \"$SRC\" | head -1 || true)\nif [ -n \"$VERSION\" ]; then\n    SCRAPED=$(date -j -u -f \"%Y-%m-%dT%H:%M:%SZ\" \"$VERSION\" \"+%s\" 2>/dev/null || true)\n    if [ -n \"${SCRAPED:-}\" ]; then\n        AGE_DAYS=$(( ($(date -u \"+%s\") - SCRAPED) / 86400 ))\n        if [ \"$AGE_DAYS\" -gt \"$MAX_AGE_DAYS\" ]; then\n            echo \"warning: Bundled zone data is ${AGE_DAYS} days old (scraped ${VERSION}; threshold ${MAX_AGE_DAYS} days). Camera zones / speed limits may be stale. Refresh it with: bash scrapers/scripts/refresh-zones.sh\"\n        fi\n    fi\nfi\n";
