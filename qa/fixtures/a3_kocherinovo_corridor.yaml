# SrednaBG — qa
#
# Northbound A3 "Струма" motorway past the Кочериново interchange, where it
# sweeps alongside the start of the I-1 average-speed zone `i1-02-north`.
# Real OSM geometry (way ref "A 3"), resampled to ~20 m and ordered in the
# direction of travel (Greece -> Sofia).
#
# This is a road the driver is NOT on the zone for: the motorway is a separate
# carriageway that merely passes close by. The app used to open a full phantom
# traversal of the 10.6 km zone here — see qa/scenarios/edge/parallel_motorway.py.
#
# To refresh, re-query Overpass for way["ref"="A 3"] in the zone's bbox.

zone_id: i1-02-north
# The on-road band the corridor has to get inside for the zone to match at all
# (RoadMatcher.DEFAULT_MAX_DISTANCE_M — i1-02-north is a `road`, not a motorway).
# The corridor's closest approach is ~7 m, so the band gate is cleared easily;
# the scenario re-derives that rather than trusting a number pinned here.
on_road_band_m: 100
speed_kmh: 110

# Course-over-ground bias, degrees, added to every synthesized fix heading.
#
# The band gate is cleared by the raw geometry with room to spare (7 m at the
# closest approach). The *heading* gate is what sits on a knife edge: along the
# in-band stretch the chord between consecutive OSM vertices runs 45.3-47.5° off
# the zone's end-to-end bearing, i.e. 0.3-2.5° the safe side of the old 45°
# tolerance. A noiseless replay of the idealised chord therefore squeaks past the
# old gate — while the real drive, on a receiver whose course-over-ground wanders
# several degrees fix to fix, did not.
#
# So model that receiver explicitly rather than pretending the chord is what the
# phone reported: a fixed (deterministic, no RNG) bias toward north. At +8° the
# old gates match 7 consecutive fixes spanning 156 m of zone arc — a phantom
# traversal — while the fixed engine sees at most 109 m of direction-matching
# travel, comfortably under its 300 m ENTRY_CONFIRM_DISTANCE_M. The scenario
# asserts the "old gates would have matched" premise, so this can't rot into a
# vacuous pass.
course_bias_deg: 8
