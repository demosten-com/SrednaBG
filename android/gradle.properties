android.useAndroidX=true
# 3 GB, not the 2 GB Studio template default. `assembleDebug` builds BOTH flavors
# in one invocation and each APK embeds the ~52 MB offline map bundle, so AGP's
# packaging worker holds those entries while the KSP/Hilt/Compose caches from the
# preceding test tasks are still resident. 2 GB left no headroom, and an OOM in
# that worker surfaces only as an opaque "A failure occurred while executing
# PackageAndroidArtifact$IncrementalSplitterRunnable" with no cause line.
#
# Deliberately 3 GB and not more: CI is a *16 GB* M4 mini. Java heap and the
# native memory zipflinger mmaps the APK entries into compete for the same RAM,
# so over-sizing the heap can make a native-allocation failure MORE likely, not
# less. Cap the Kotlin daemon too — left unset it inherits this -Xmx, which would
# silently double the JVM footprint to 6 GB on that box.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
kotlin.daemon.jvmargs=-Xmx2048m
# Build-performance + hygiene flags. nonTransitiveRClass is safe here: :core is a
# pure-JVM module with no Android resources, so :app is the only R-class holder.
org.gradle.caching=true
org.gradle.parallel=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
